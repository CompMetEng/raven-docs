# Read the Docs configuration file for the RAVEN documentation
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Pull in the RAVEN (MATLAB), raven-toolbox (Python) and hanpo-GEM (protocol)
# sources tracked as git submodules, so their docstrings and protocol code can
# be auto-documented.
submodules:
  include: all
  recursive: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements.txt
