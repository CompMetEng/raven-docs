name: Guide examples

# Runs every Python snippet in docs/guide/ and checks it still prints what the
# page says it prints. See scripts/run_examples.py.
#
# The submodules are bumped automatically (update-submodules.yml), so the weekly
# schedule is what catches an upstream API change that silently invalidates a
# documented output; the pull_request trigger catches a page that was written
# with a snippet that never ran.

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "docs/data/**"
      - "scripts/run_examples.py"
      - ".github/workflows/examples.yml"
      - "raven-toolbox"
      - "RAVEN"
  pull_request:
    paths:
      - "docs/guide/**"
      - "docs/data/**"
      - "scripts/run_examples.py"
      - ".github/workflows/examples.yml"
      - "raven-toolbox"
      - "RAVEN"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # raven-toolbox is installed from the submodule, so the docs are always
          # checked against the exact commit the API reference is generated from.
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install raven-toolbox from the submodule
        run: |
          python -m pip install --upgrade pip
          # GLPK arrives as a wheel via cobrapy's optlang/swiglpk dependency, so
          # no system solver has to be installed; it solves the LPs and MILPs.
          # openpyxl is needed by the Excel export example, gurobipy by the
          # quadratic MOMA example, which needs a QP solver. The size-limited
          # licence that comes with the gurobipy wheel covers a model that small.
          python -m pip install "./raven-toolbox[excel]" gurobipy pyyaml

      - name: Report versions
        run: |
          python -c "import cobra, raven_toolbox, optlang; print('cobra', cobra.__version__); print('raven_toolbox', raven_toolbox.__version__); print('solvers', sorted(optlang.available_solvers))"

      - name: Run guide examples
        run: python scripts/run_examples.py --language python

  matlab:
    name: MATLAB examples
    runs-on: ubuntu-latest
    # MATLAB starts slowly and importModel takes about 80 s on yeast-GEM, so this
    # job is minutes rather than seconds.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # RAVEN comes from the submodule, together with the GLPK and libSBML
          # mex files it bundles -- nothing else has to be installed.
          submodules: recursive

      # Free of charge on GitHub-hosted runners for public repositories.
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          # RAVEN's Gurobi path calls getCurrentTask (to give each parallel
          # worker one thread), which ships with the Parallel Computing Toolbox.
          # Without it every Gurobi solve fails, single-threaded or not.
          products: Parallel_Computing_Toolbox

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # scripts/project.py reads scripts/project.yml with PyYAML.
      - name: Install PyYAML
        run: python -m pip install pyyaml

      # Gurobi's MATLAB interface, for the examples marked `needs-gurobi`: MILPs
      # that RAVEN also solves on its bundled GLPK, but that the page runs on
      # Gurobi. Both steps are no-ops when the repository has no licence secrets.
      - name: Install Gurobi for MATLAB
        env:
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: |
          if [ -z "$WLSACCESSID" ]; then
            echo "No Gurobi licence configured -- needs-gurobi examples will be skipped."
            exit 0
          fi
          curl -sSL "https://packages.gurobi.com/13.0/gurobi13.0.2_linux64.tar.gz" \
            -o "$RUNNER_TEMP/gurobi.tar.gz"
          tar xzf "$RUNNER_TEMP/gurobi.tar.gz" -C "$RUNNER_TEMP"
          umask 077
          {
            echo "WLSACCESSID=$WLSACCESSID"
            echo "WLSSECRET=$WLSSECRET"
            echo "LICENSEID=$LICENSEID"
          } > "$RUNNER_TEMP/gurobi.lic"
          echo "GUROBI_HOME=$RUNNER_TEMP/gurobi1302/linux64" >> "$GITHUB_ENV"
          echo "GRB_LICENSE_FILE=$RUNNER_TEMP/gurobi.lic" >> "$GITHUB_ENV"
          echo "DOCS_GUROBI=1" >> "$GITHUB_ENV"

      # MATLAB on a GitHub-hosted runner is licensed only when one of the
      # matlab-actions run-* actions starts it -- starting matlab ourselves fails
      # the license checkout. So the harness is prepared here, run by the action,
      # and its output checked afterwards: the same tool, the same pages, in
      # three steps instead of one.
      - name: Prepare the MATLAB harness
        run: >
          python scripts/run_examples.py --language matlab
          --matlab-prepare "${{ runner.temp }}/matlab-harness"

      - uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath('${{ runner.temp }}/matlab-harness');
            docs_run('${{ runner.temp }}/matlab-harness')

      - name: Check the MATLAB output
        run: >
          python scripts/run_examples.py --language matlab
          --matlab-collect "${{ runner.temp }}/matlab-harness"
