name: Docs build

# Builds the site with warnings as errors and checks it against the docs-site
# standard. The weekly run finds a change in a submodule, a dependency or an
# external page that nobody pushed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Check the site against the standard
        run: python scripts/check_site.py .

      - name: Check names on the guide pages
        run: python scripts/check_names.py

      - name: Build with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # Not yet blocking: the state of the external links of this site was not
      # known when the check was added. Remove continue-on-error after a run
      # that is clean, or list the links that reject crawlers in linkcheck_ignore.
      - name: Check external links
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
