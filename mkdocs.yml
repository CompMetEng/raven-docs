      - 9. Quality control: guide/quality-control.md
      - 10. Context-specific models (tINIT / ftINIT): guide/init.md
      - 11. Deletions and essentiality: guide/deletions.md
      - 12. Metabolic tasks: guide/tasks.md
      - 13. Gap-filling: guide/gap-filling.md
      - 14. Flux variability: guide/fva.md
      - 15. Random sampling: guide/sampling.md
      - 16. Combining and simplifying: guide/combining.md
      - 17. Comparing models: guide/comparing.md
      - 18. Reconstruction from homology: guide/homology.md
      - 19. Reconstruction from KEGG: guide/kegg.md
      - 20. Engineering targets: guide/engineering.md
      - 21. Table-driven curation: guide/curation.md
      - 22. Biomass and annotation: guide/biomass.md
      - Worked protocol, H. polymorpha (MATLAB):
          - Overview: protocol/index.md
          - Introduction: protocol/reconstruction.md
          - Materials and installation: protocol/materials.md
          - Import template models: protocol/template-models.md
          - Draft from homology: protocol/homology.md
          - Biomass composition: protocol/biomass.md
          - Curation of lipid reactions: protocol/lipid-curation.md
          - Gap-filling: protocol/gap-filling.md
          - Save and simulate: protocol/simulation.md
